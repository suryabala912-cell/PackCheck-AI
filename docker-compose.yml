version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: packcheck-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: packcheck_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/init_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: packcheck-ai-services
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: packcheck-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/packcheck_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - AI_SERVICE_URL=http://ai-services:8000
    depends_on:
      db:
        condition: service_healthy
      ai-services:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: packcheck-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:

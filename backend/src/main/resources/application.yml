server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: packcheck-backend
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/packcheck_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

file:
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO
    com.sih.packcheck: DEBUG

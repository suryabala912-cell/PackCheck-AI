server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: packcheck-backend
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/packcheck_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

security:
  jwt:
    secret: ${JWT_SECRET:PackCheckPrototypeSecretKeyForJwtTokenGeneration2026!SIH26034}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${FRONTEND_URL:${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

file:
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO
    com.sih.packcheck: DEBUG
